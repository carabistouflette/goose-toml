name: Source editor
on:
  push:
    paths: ['source/**', '.github/workflows/source-editor.yml', 'toml.goose', 'document.goose', 'writer.goose', 'vendor/**', 'GOOSE_REVISION', 'TOML_TEST_REVISION', 'scripts/setup-goose.sh', 'scripts/setup-toml-test.sh']
  pull_request:
    paths: ['source/**', '.github/workflows/source-editor.yml', 'toml.goose', 'document.goose', 'writer.goose', 'vendor/**', 'GOOSE_REVISION', 'TOML_TEST_REVISION', 'scripts/setup-goose.sh', 'scripts/setup-toml-test.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain
          key: source-editor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('GOOSE_REVISION', 'scripts/setup-goose.sh', 'TOML_TEST_REVISION') }}
      - run: make setup
      - run: ./scripts/setup-toml-test.sh
      - run: make -C source check test property conformance
      - run: make -C source sanitize SANITIZER_CC=gcc
      - run: make -C source sanitize SANITIZER_CC=clang
      - run: make -C source fuzz FUZZ_SECONDS=15 FUZZ_RUNS=30000
      - run: make -C source bench BENCH_ITERATIONS=5
